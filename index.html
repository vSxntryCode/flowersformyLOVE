<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#030508"
    >

    <title>For My Love ♡</title>


    <style>

        /* =========================================================
           RESET / FULL SCREEN
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            width: 100%;
            height: 100%;

            background: #030508;
        }


        body {
            width: 100%;
            height: 100%;

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    #111b2b 0%,
                    #080c14 42%,
                    #030508 100%
                );

            color: white;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            -webkit-text-size-adjust: 100%;
        }


        /* =========================================================
           FULL SCREEN BACKGROUND
        ========================================================= */

        .background {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            background:
                radial-gradient(
                    ellipse at 50% 52%,
                    rgba(57, 91, 165, 0.16) 0%,
                    rgba(22, 34, 60, 0.08) 35%,
                    transparent 68%
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================================
           STARS
        ========================================================= */

        #stars {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 1;
        }


        .star {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: white;

            opacity: 0.3;

            animation:
                twinkle
                var(--duration)
                ease-in-out
                infinite;

            animation-delay:
                var(--delay);
        }


        .star.big {

            width: 3px;
            height: 3px;

            box-shadow:
                0 0 7px
                rgba(255,255,255,0.45);
        }


        @keyframes twinkle {

            0%,
            100% {

                opacity: 0.12;

                transform:
                    scale(0.7);
            }

            50% {

                opacity: 0.85;

                transform:
                    scale(1.5);
            }
        }


        /* =========================================================
           FLOWER FIELD
        ========================================================= */

        #flowers {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 5;
        }


        /* =========================================================
           FLOWER
        ========================================================= */

        .flower {

            position: absolute;

            bottom: var(--bottom);

            left: var(--left);

            width: var(--size);
            height: var(--height);

            transform-origin:
                center bottom;

            opacity:
                var(--opacity);

            animation:
                sway
                var(--sway)
                ease-in-out
                infinite;

            animation-delay:
                var(--delay);

            z-index:
                var(--layer);
        }


        @keyframes sway {

            0%,
            100% {

                transform:
                    rotate(
                        calc(
                            var(--rotation) - 2deg
                        )
                    );
            }

            50% {

                transform:
                    rotate(
                        calc(
                            var(--rotation) + 2deg
                        )
                    );
            }
        }


        /* =========================================================
           STEM
        ========================================================= */

        .stem {

            position: absolute;

            left: 50%;

            bottom: 0;

            width: var(--stem-width);

            height: 100%;

            transform:
                translateX(-50%);

            border-radius: 999px;

            background:
                linear-gradient(
                    90deg,
                    #102516,
                    #3f7943,
                    #142e19
                );

            opacity: 0.9;
        }


        /* =========================================================
           LEAVES
        ========================================================= */

        .leaf {

            position: absolute;

            width: var(--leaf-width);

            height: var(--leaf-height);

            background:
                linear-gradient(
                    90deg,
                    #14351b,
                    #4c894b
                );

            border-radius:
                100% 0 100% 0;

            opacity: 0.9;
        }


        .leaf.left {

            left: 50%;

            bottom:
                var(--leaf-position);

            transform:
                translateX(-100%)
                rotate(-27deg);
        }


        .leaf.right {

            left: 50%;

            bottom:
                var(--leaf-position);

            transform:
                rotate(205deg);
        }


        /* =========================================================
           FLOWER HEAD
        ========================================================= */

        .head {

            position: absolute;

            left: 50%;

            top: 0;

            width: var(--head-size);
            height: var(--head-size);

            transform:
                translateX(-50%);

            z-index: 5;
        }


        /* =========================================================
           CORNFLOWER
        ========================================================= */

        .blue .head {

            background:

                radial-gradient(
                    circle,
                    #e8c86c 0 7%,
                    #a57f36 8% 13%,
                    transparent 14%
                ),

                conic-gradient(

                    from 0deg,

                    #376aca 0deg 10deg,
                    #75a2ed 10deg 20deg,

                    #3d71d4 20deg 30deg,
                    #6e9aea 30deg 40deg,

                    #315fc1 40deg 50deg,
                    #7ba7f2 50deg 60deg,

                    #3b6ed1 60deg 70deg,
                    #709ced 70deg 80deg,

                    #3565c7 80deg 90deg,
                    #78a5f1 90deg 100deg,

                    #3b6ed0 100deg 110deg,
                    #6e9bed 110deg 120deg,

                    #315fc1 120deg 130deg,
                    #7aa6f2 130deg 140deg,

                    #3d70d2 140deg 150deg,
                    #6f9ced 150deg 160deg,

                    #3565c5 160deg 170deg,
                    #7ba8f3 170deg 180deg,

                    #3c6ed1 180deg 190deg,
                    #6f9bed 190deg 200deg,

                    #315fc1 200deg 210deg,
                    #7ba7f2 210deg 220deg,

                    #3b6ed0 220deg 230deg,
                    #709ced 230deg 240deg,

                    #3565c6 240deg 250deg,
                    #7ba7f2 250deg 260deg,

                    #3d70d2 260deg 270deg,
                    #6f9ced 270deg 280deg,

                    #3565c6 280deg 290deg,
                    #79a5f1 290deg 300deg,

                    #3b6dd0 300deg 310deg,
                    #6e9bec 310deg 320deg,

                    #3565c5 320deg 330deg,
                    #7ca8f3 330deg 340deg,

                    #3d70d1 340deg 350deg,
                    #72a0ee 350deg 360deg
                );

            clip-path:
                polygon(

                    50% 0%,
                    59% 13%,
                    75% 4%,

                    78% 22%,
                    97% 28%,

                    86% 43%,
                    100% 57%,

                    80% 63%,
                    77% 84%,

                    60% 78%,
                    50% 100%,

                    40% 79%,
                    22% 89%,

                    20% 68%,
                    2% 61%,

                    14% 45%,
                    0% 29%,

                    20% 24%,
                    24% 6%,

                    40% 16%
                );

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(62, 119, 235, 0.45)
                );
        }


        /* =========================================================
           PINK FLOWER
        ========================================================= */

        .pink .head {

            background:

                radial-gradient(
                    circle,
                    #f3d0dc 0 8%,
                    #bd718e 9% 14%,
                    transparent 15%
                ),

                conic-gradient(

                    from 0deg,

                    #d87fa3 0deg 18deg,
                    #f1b9cc 18deg 36deg,

                    #dc86a8 36deg 54deg,
                    #f5c2d3 54deg 72deg,

                    #d981a4 72deg 90deg,
                    #f0b7cb 90deg 108deg,

                    #da82a5 108deg 126deg,
                    #f4bfd1 126deg 144deg,

                    #d980a3 144deg 162deg,
                    #f2bbce 162deg 180deg,

                    #d980a4 180deg 198deg,
                    #f4bfd1 198deg 216deg,

                    #da82a6 216deg 234deg,
                    #f1b8cb 234deg 252deg,

                    #d981a4 252deg 270deg,
                    #f4c0d1 270deg 288deg,

                    #da82a6 288deg 306deg,
                    #f0b7ca 306deg 324deg,

                    #d980a4 324deg 342deg,
                    #f4bfd1 342deg 360deg
                );

            clip-path:
                polygon(

                    50% 0%,
                    63% 14%,
                    80% 5%,

                    83% 24%,
                    100% 31%,

                    85% 47%,
                    97% 64%,

                    77% 70%,
                    73% 91%,

                    56% 81%,
                    44% 100%,

                    35% 80%,
                    15% 91%,

                    20% 70%,
                    0% 63%,

                    15% 47%,
                    1% 31%,

                    20% 24%,
                    23% 6%,

                    40% 16%
                );

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(232, 125, 174, 0.32)
                );
        }


        /* =========================================================
           MESSAGE BACKDROP
        ========================================================= */

        .message-glow {

            position: absolute;

            left: 50%;
            top: 47%;

            transform:
                translate(-50%, -50%);

            width:
                min(105vw, 700px);

            height:
                min(65vh, 620px);

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(2, 5, 10, 0.88) 0%,
                    rgba(2, 5, 10, 0.65) 38%,
                    rgba(2, 5, 10, 0.25) 62%,
                    transparent 75%
                );

            z-index: 20;

            pointer-events: none;
        }


        /* =========================================================
           MESSAGE
        ========================================================= */

        .message {

            position: absolute;

            left: 50%;
            top: 48%;

            transform:
                translate(-50%, -50%);

            width:
                min(88vw, 560px);

            text-align: center;

            z-index: 30;

            padding:
                20px 10px;
        }


        .message h1 {

            font-size:
                clamp(
                    45px,
                    11vw,
                    78px
                );

            font-weight: 400;

            color: #f7f0e5;

            letter-spacing: 1px;

            margin-bottom: 18px;

            text-shadow:
                0 3px 22px #000,
                0 0 35px
                rgba(255,255,255,0.08);
        }


        .divider {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 13px;

            color: #8da8e7;

            font-size: 18px;

            margin-bottom: 22px;

            text-shadow:
                0 0 10px
                rgba(100,150,255,0.4);
        }


        .line {

            width: 55px;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(135,165,225,0.65)
                );
        }


        .line.right {

            background:
                linear-gradient(
                    90deg,
                    rgba(135,165,225,0.65),
                    transparent
                );
        }


        .message p {

            color: #eeeeee;

            font-size:
                clamp(
                    15px,
                    4vw,
                    18px
                );

            line-height: 1.8;

            margin-bottom: 9px;

            text-shadow:
                0 2px 13px #000,
                0 0 20px #000;
        }


        .message .final {

            margin-top: 21px;

            color: #efb4cb;

            font-weight: bold;

            font-size:
                clamp(
                    16px,
                    4vw,
                    19px
                );
        }


        /* =========================================================
           FLOATING PETALS
        ========================================================= */

        #petals {

            position: absolute;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 15;
        }


        .petal {

            position: absolute;

            bottom: -30px;

            font-size:
                var(--size);

            color:
                var(--color);

            opacity: 0;

            animation:
                floatUp
                var(--duration)
                linear
                forwards;
        }


        @keyframes floatUp {

            0% {

                opacity: 0;

                transform:
                    translate(0, 0)
                    rotate(0deg);
            }

            12% {

                opacity: 0.55;
            }

            70% {

                opacity: 0.3;
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--drift),
                        -110vh
                    )
                    rotate(220deg);
            }
        }


        /* =========================================================
           MOBILE — THIS IS THE IMPORTANT PART
        ========================================================= */

        @media (max-width: 600px) {

            body {

                height: 100dvh;
                min-height: 100dvh;

                background:
                    radial-gradient(
                        ellipse at 50% 45%,
                        #111a28 0%,
                        #080c14 40%,
                        #030508 100%
                    );
            }


            .message {

                top: 47%;

                width: 88vw;

                padding:
                    15px 3px;
            }


            .message h1 {

                font-size: 47px;

                margin-bottom: 14px;
            }


            .divider {

                margin-bottom: 18px;

                gap: 10px;
            }


            .line {

                width: 40px;
            }


            .message p {

                font-size: 15px;

                line-height: 1.65;

                margin-bottom: 7px;
            }


            .message .final {

                margin-top: 16px;

                font-size: 17px;
            }


            .message-glow {

                top: 47%;

                width: 115vw;

                height: 72vh;
            }
        }


        /* =========================================================
           SMALL / SHORT PHONES
        ========================================================= */

        @media (
            max-width: 600px
        ) and (
            max-height: 700px
        ) {

            .message {

                top: 45%;
            }


            .message h1 {

                font-size: 42px;

                margin-bottom: 10px;
            }


            .divider {

                margin-bottom: 13px;
            }


            .message p {

                font-size: 14px;

                line-height: 1.5;

                margin-bottom: 5px;
            }


            .message .final {

                margin-top: 12px;
            }
        }


        /* =========================================================
           SAFE AREA — IPHONE
        ========================================================= */

        @supports (
            padding-top: env(safe-area-inset-top)
        ) {

            .message {

                padding-top:
                    max(
                        15px,
                        env(safe-area-inset-top)
                    );
            }
        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="background"></div>

    <div id="stars"></div>


    <!-- FLOWERS -->

    <div id="flowers"></div>


    <!-- TEXT BACKDROP -->

    <div class="message-glow"></div>


    <!-- MESSAGE -->

    <div class="message">

        <h1>
            For My Love
        </h1>


        <div class="divider">

            <span class="line"></span>

            ♡

            <span class="line right"></span>

        </div>


        <p>
            I planted these flowers just for you 💙
        </p>


        <p>
            Some are pink, some are blue,
        </p>


        <p>
            but every one reminded me of you.
        </p>


        <p class="final">
            I hope you like them.
        </p>

    </div>


    <!-- PETALS -->

    <div id="petals"></div>


    <script>

        /* =========================================================
           STARS
        ========================================================= */

        const stars =
            document.getElementById("stars");


        const starCount =
            window.innerWidth <= 600
                ? 80
                : 120;


        for (
            let i = 0;
            i < starCount;
            i++
        ) {

            const star =
                document.createElement("div");


            star.classList.add("star");


            if (
                Math.random() > 0.84
            ) {

                star.classList.add("big");
            }


            star.style.left =
                Math.random() * 100 + "%";


            star.style.top =
                Math.random() * 100 + "%";


            star.style.setProperty(
                "--duration",
                (
                    2 +
                    Math.random() * 5
                ) + "s"
            );


            star.style.setProperty(
                "--delay",
                (
                    Math.random() * -5
                ) + "s"
            );


            stars.appendChild(star);
        }



        /* =========================================================
           FLOWER GENERATOR
        ========================================================= */

        const flowers =
            document.getElementById(
                "flowers"
            );


        const isMobile =
            window.innerWidth <= 600;


        /*
            LOTS of flowers.

            Mobile gets 95.
            Desktop gets 120.

            They are deliberately layered
            at different heights.
        */

        const flowerCount =
            isMobile
                ? 95
                : 120;


        for (
            let i = 0;
            i < flowerCount;
            i++
        ) {

            const flower =
                document.createElement(
                    "div"
                );


            flower.classList.add(
                "flower"
            );


            /* -----------------------------------------------------
               FLOWER TYPE
            ----------------------------------------------------- */

            const pink =
                Math.random() < 0.30;


            flower.classList.add(
                pink
                    ? "pink"
                    : "blue"
            );


            /* -----------------------------------------------------
               SIZE
            ----------------------------------------------------- */

            let size;


            const sizeRoll =
                Math.random();


            if (
                sizeRoll < 0.25
            ) {

                size =
                    isMobile
                        ? 22 + Math.random() * 15
                        : 25 + Math.random() * 20;

            } else if (
                sizeRoll < 0.75
            ) {

                size =
                    isMobile
                        ? 30 + Math.random() * 24
                        : 36 + Math.random() * 28;

            } else {

                size =
                    isMobile
                        ? 48 + Math.random() * 25
                        : 55 + Math.random() * 35;
            }


            /* -----------------------------------------------------
               STEM HEIGHT

               Much taller than before so flowers
               reach far up the screen.
            ----------------------------------------------------- */

            const stemHeight =
                isMobile
                    ? 120 + Math.random() * 480
                    : 140 + Math.random() * 500;


            /* -----------------------------------------------------
               POSITION
            ----------------------------------------------------- */

            let left =
                Math.random() * 106 - 3;


            /*
                Don't leave a giant empty centre,
                but make the biggest flowers mostly
                surround the text.
            */

            const distanceFromCentre =
                Math.abs(
                    left - 50
                );


            if (
                distanceFromCentre < 16 &&
                Math.random() < 0.55
            ) {

                left =
                    left < 50
                        ? left - 15
                        : left + 15;
            }


            /* -----------------------------------------------------
               BOTTOM POSITION

               This creates multiple layers:
               some flowers are rooted low,
               others appear higher.
            ----------------------------------------------------- */

            let bottom;


            const heightRoll =
                Math.random();


            if (
                heightRoll < 0.65
            ) {

                bottom =
                    -8 +
                    Math.random() * 18;

            } else if (
                heightRoll < 0.88
            ) {

                bottom =
                    3 +
                    Math.random() * 18;

            } else {

                bottom =
                    12 +
                    Math.random() * 20;
            }


            /* -----------------------------------------------------
               VISUAL VARIABLES
            ----------------------------------------------------- */

            flower.style.setProperty(
                "--left",
                left + "%"
            );


            flower.style.setProperty(
                "--bottom",
                bottom + "%"
            );


            flower.style.setProperty(
                "--size",
                size + "px"
            );


            flower.style.setProperty(
                "--height",
                stemHeight + "px"
            );


            flower.style.setProperty(
                "--head-size",
                size + "px"
            );


            flower.style.setProperty(
                "--stem-width",
                (
                    2 +
                    Math.random() * 2
                ) + "px"
            );


            flower.style.setProperty(
                "--leaf-width",
                (
                    30 +
                    Math.random() * 35
                ) + "px"
            );


            flower.style.setProperty(
                "--leaf-height",
                (
                    10 +
                    Math.random() * 8
                ) + "px"
            );


            flower.style.setProperty(
                "--leaf-position",
                (
                    45 +
                    Math.random() * 190
                ) + "px"
            );


            flower.style.setProperty(
                "--rotation",
                (
                    -8 +
                    Math.random() * 16
                ) + "deg"
            );


            flower.style.setProperty(
                "--sway",
                (
                    4 +
                    Math.random() * 5
                ) + "s"
            );


            flower.style.setProperty(
                "--delay",
                (
                    Math.random() * -6
                ) + "s"
            );


            flower.style.setProperty(
                "--opacity",
                (
                    0.35 +
                    Math.random() * 0.6
                )
            );


            flower.style.setProperty(
                "--layer",
                Math.floor(
                    5 +
                    Math.random() * 14
                )
            );


            /* -----------------------------------------------------
               STEM
            ----------------------------------------------------- */

            const stem =
                document.createElement(
                    "div"
                );


            stem.classList.add(
                "stem"
            );


            flower.appendChild(
                stem
            );


            /* -----------------------------------------------------
               LEAVES
            ----------------------------------------------------- */

            if (
                Math.random() > 0.15
            ) {

                const leaf =
                    document.createElement(
                        "div"
                    );


                leaf.classList.add(
                    "leaf",
                    "left"
                );


                flower.appendChild(
                    leaf
                );
            }


            if (
                Math.random() > 0.2
            ) {

                const leaf =
                    document.createElement(
                        "div"
                    );


                leaf.classList.add(
                    "leaf",
                    "right"
                );


                flower.appendChild(
                    leaf
                );
            }


            /* -----------------------------------------------------
               FLOWER HEAD
            ----------------------------------------------------- */

            const head =
                document.createElement(
                    "div"
                );


            head.classList.add(
                "head"
            );


            flower.appendChild(
                head
            );


            flowers.appendChild(
                flower
            );
        }



        /* =========================================================
           FLOATING PETALS
        ========================================================= */

        const petals =
            document.getElementById(
                "petals"
            );


        function createPetal() {

            const petal =
                document.createElement(
                    "div"
                );


            petal.classList.add(
                "petal"
            );


            const isPink =
                Math.random() > 0.48;


            petal.textContent =
                isPink
                    ? "✿"
                    : "✦";


            petal.style.left =
                Math.random() * 100 + "%";


            petal.style.setProperty(
                "--color",
                isPink
                    ? "#e4a5bf"
                    : "#7095df"
            );


            petal.style.setProperty(
                "--size",
                (
                    9 +
                    Math.random() * 12
                ) + "px"
            );


            petal.style.setProperty(
                "--duration",
                (
                    7 +
                    Math.random() * 6
                ) + "s"
            );


            petal.style.setProperty(
                "--drift",
                (
                    -100 +
                    Math.random() * 200
                ) + "px"
            );


            petals.appendChild(
                petal
            );


            setTimeout(
                () => {

                    petal.remove();

                },
                14000
            );
        }


        /* Start with lots of petals */

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            setTimeout(
                createPetal,
                i * 450
            );
        }


        setInterval(
            createPetal,
            1100
        );

    </script>


</body>

</html>
